name: release

on:
  push:
    tags:
      - "*"
  workflow_dispatch:

jobs:
  release_ohos:
    name: Release for ohos
    runs-on: ubuntu-latest
    permissions: write-all
    steps:
      - name: Clone repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Compress images in assets/images
        run: |
          npm install --no-save sharp glob
          node -e '
            const sharp = require("sharp");
            const glob = require("glob");
            const fs = require("fs");

            (async () => {
              const files = glob.sync("assets/images/**/*.@(png|jpg|jpeg)");
              for (const f of files) {
                const img = sharp(f);
                const { format } = await img.metadata();

                const buf = await (format === "jpeg"
                  ? img.jpeg({ quality: 85, mozjpeg: true })
                  : img.png({ compressionLevel: 9, palette: true })
                ).toBuffer();

                if (buf.length < fs.statSync(f).size) fs.writeFileSync(f, buf);
              }
            })();
          '

      - name: Extract tag name
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            tag="${GITHUB_REF#refs/tags/}"
          else
            tag="$(git describe --tags --abbrev=0 2>/dev/null || echo '')"
          fi
          # sanitize slashes in tag/branch name for filename use
          tag="${tag//\//-}"
          echo "tag=${tag}" >> $GITHUB_ENV
        shell: bash

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y curl xz-utils zip libglu1-mesa
        shell: bash

      - name: Setup HarmonyOS toolchain
        uses: ErBWs/setup-ohos@v1
        with:
          version: "26.0.0.821"
          cache: true

      - name: Setup JDK17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"

      - name: Setup flutter-ohos
        run: |
          git clone -b oh-3.41.9-dev https://gitcode.com/CPF-Flutter/flutter_flutter.git $GITHUB_WORKSPACE/flutter
          echo "$GITHUB_WORKSPACE/flutter/bin" >> $GITHUB_PATH
        shell: bash

      - name: Generate env.json
        run: dart .vscode/build_env.dart "${{ env.tag }}"
        shell: bash

      - name: Get Flutter dependencies
        run: flutter pub get
        shell: bash
        env:
          GIT_LFS_SKIP_SMUDGE: 1

      - name: Rename package
        run: |
          sed -i "s/name: PiliPlus/name: piliplus/g" pubspec.yaml
          find lib -type f -name "*.dart" -exec sed -i "s/package:PiliPlus/package:piliplus/g" {} \;
        shell: bash

      - name: Build Flutter for ohos
        run: flutter build hap --release --dart-define-from-file=.vscode/env.json
        shell: bash
        continue-on-error: true

      - name: Package ohos build output
        run: cp ./ohos/entry/build/default/outputs/default/entry-default-unsigned.hap PiliPlus_ohos_${{ env.tag }}_unsigned.hap
        shell: bash

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ env.tag }}
          draft: true
          files: PiliPlus_ohos_*.hap
