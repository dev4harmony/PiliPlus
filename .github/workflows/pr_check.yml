name: pr_check

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
    paths-ignore:
      - 'static/**'
      - '**.md'
      - '.gitignore'
      - '.github/ISSUE_TEMPLATE/**'
  workflow_dispatch:

jobs:
  analyze:
    name: Dart Analyze
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup flutter-ohos
        run: |
          git clone -b oh-3.41.9-release https://gitcode.com/CPF-Flutter/flutter_flutter.git $GITHUB_WORKSPACE/flutter
          echo "$GITHUB_WORKSPACE/flutter/bin" >> $GITHUB_PATH
          $GITHUB_WORKSPACE/flutter/bin/flutter --version
        shell: bash

      # 用 dart pub get 而非 flutter pub get：仓库带 ohos/ 目录，flutter pub get
      # 会走 flutter_tools 的鸿蒙平台准备流程，缺 HOS_SDK_HOME 时直接 throwToolExit
      # （No Hmos SDK found）。分析只需要 package_config.json，不需要鸿蒙 SDK。
      - name: Get dependencies
        run: dart pub get
        env:
          GIT_LFS_SKIP_SMUDGE: 1

      - name: Dart Analyze
        run: dart analyze --no-fatal-warnings
